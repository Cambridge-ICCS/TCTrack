# TCTrack Dashboard - Datasette configuration

title: TCTrack Dashboard
description: Explore and compare tropical cyclone trajectories from TCTrack.

extra_css_urls:
  - url: /static/light.css  # dark.css

# Plugin settings

plugins:
  datasette-maplibre:
    # basemap: https://tiles.openfreemap.org/styles/dark  # dark
    basemap: https://tiles.openfreemap.org/styles/positron  # light
    group_by:
      column: trajectory_id
      properties: [filename, year]
    point:
      radius: 4
      radius_property:
        column: wind_speed
        min: [0, 2]
        max: [30, 10]
        exponential: 1.2
      opacity_property:
        column: wind_speed
        min: [0, 0.1]
        max: [30, 1.0]
    line:
      thickness: 2
    heatmap:
      weight_property:
        column: wind_speed
        min: [0, 0]
        max: [30, 1]
        exponential: 1.2
      # dark map heatmap
      # palette:
      #   low: '#1a237e'
      #   mid: '#ad1457'
      #   high: '#ffeb3b'
      # light map heatmap
      palette:
        low: '#81d4fa'
        mid: '#ffeb3b'
        high: '#ffa000'
      max_zoom: 8
      opacity: 0.8

    # dark palette
    # palette:
    #   single: '#d0b100'
    #   layers:
    #     - '#ee7733'
    #     - '#0077bb'
    #     - '#33bbee'
    #     - '#ee3377'
    #     - '#cc3311'
    #     - '#009988'
    #     - '#bbbbbb'

    # light palette
    palette:
      single: '#ffa726'
      layers:
        - '#ee7733'
        - '#0077bb'
        - '#33bbee'
        - '#ee3377'
        - '#cc3311'
        - '#009988'
        - '#bbbbbb'
    max_layers: 7


# Database and table metadata
# Database name must match served database
# This is most important for showing facets on views

databases:
  database_name:
    title: Cyclone Tracks
    description_html: >-
      <p>Cyclone trajectories imported from TCTrack NetCDF files.</p>
      <p>Data is organised:
        <code>collections</code> &rarr; <code>files</code> &rarr;
        <code>trajectories</code> &rarr; <code>observations</code>
      </p>
    source: TCTrack

    tables:
      collections:
        label_column: name
        description: Named groups of imported track files.
        columns:
          name: Collection name.
          created: Date the collection was created (UTC).

      files:
        label_column: filename
        description: Individual TCTrack NetCDF files imported by build-db.
        columns:
          filepath: Path of the imported file on the build machine.
          tctrack_version: TCTrack version that produced the file.
          tracker_name: Tracking algorithm used for this file.
          tracker_parameters: Tracker configuration for the run (JSON).
          trajectories: Number of trajectories imported from this file.
          observations: Total observation points imported from this file.
          time_units: Time units of the source timestamps.
          time_calendar: Calendar of the source timestamps.
          created: Import timestamp (UTC).
        facets: [collection_id, tracker_name]

      trajectories:
        description: One row per cyclone track.
        columns:
          start_end: Start/end marker from the source file (S, E or SE).
        facets: [file_id, start_end]

      observations:
        description: One row per trajectory observation point.
        columns:
          sequence: Zero-based order of the observation within the trajectory.
          date: Observation timestamp decoded from the NetCDF time coordinate.
          air_pressure_at_sea_level: Sea level pressure at the observation point.
          surface_altitude: Model surface altitude at the observation point.
          wind_speed: Wind speed at the observation point.
          atmosphere_relative_vorticity: Relative vorticity of the atmosphere at the observation point.
        facets: []

      points:
        facets: [genesis]
      points_layer_file:
        facets: [genesis]
      points_layer_year:
        facets: [genesis]

      tracks:
        facets: [start_end]
      tracks_layer_file:
        facets: [start_end]
      tracks_layer_year:
        facets: [start_end]


    # Useful queries

    queries:
      longest_tracks:
        title: Longest tracks
        description: Trajectories with the most observation points.
        sql: |-
          select
              t.id as trajectory_id,
              f.filename,
              count(*) as observations,
              min(o.date) as first_observation,
              max(o.date) as last_observation
          from trajectories as t
              join files as f on f.id = t.file_id
              join observations as o on o.trajectory_id = t.id
          group by t.id
          order by observations desc
