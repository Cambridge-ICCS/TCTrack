# Workflow to run unit tests on the source
name: Unit Testing

# When will this workflow run?
on:
  # run on every push to main, i.e. PR merges
  push:
    branches: [ "main" ]

  # Triggers the workflow on pushes to open pull requests with code changes
  pull_request:
    paths:
      - '**.py'
      - '.github/workflows/unit-tests.yaml'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# No permissions required to run this code
permissions: {}

jobs:
  unit-test:
    name: Build & test (${{ matrix.python-version }} | ${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      # continue testing other configurations even if a matrix job fails
      fail-fast: false
      matrix:
        # Supported Python versions on Linux Ubuntu
        os: ["ubuntu-latest"]
        python-version: ["3.14", "3.13", "3.12", "3.11"]
        # test latest python version on macOS
        include:
        - os: macos-latest
          python-version: "3.14"

    steps:
    - name: Checkout code
      with:
        persist-credentials: false
      uses: actions/checkout@v7

    - name: Set up micromamba environment
      uses: mamba-org/setup-micromamba@v3
      with:
        environment-name: tctrack-env
        create-args: >-
          python=${{ matrix.python-version }}
          udunits2
          esmpy
          pytorch-cpu
        cache-environment: true

    - name: Install Package and Dependencies
      shell: micromamba-shell {0}
      run: pip install .[test]

    - name: Run unit tests
      shell: micromamba-shell {0}
      # This prevents networking to avoid a bug due to esmpy initialising MPI
      env:
        UCX_TLS: self,sm
      run: pytest tests/unit
